<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAW · Despliegue de Aplicaciones Web — Estudio y Simulacros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="mobile-header">
    <button id="menu-toggle" class="icon-btn" aria-label="Abrir menú">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="mobile-brand">
      <span class="brand-prefix">&gt;_</span> Despliegue DAW
    </div>
    <span class="badge badge-cyan">2º DAW</span>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <span class="brand-icon">&gt;_</span>
          <div>
            <div class="brand-title">DAW // Despliegue</div>
            <div class="brand-subtitle">2º DAW · Temas 1–8</div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Navegación principal">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="simulacro">
          <span class="nav-icon">⏱</span>
          <span class="nav-label">Simulacro de Examen</span>
        </button>
        <button class="nav-item" data-view="bloques">
          <span class="nav-icon">◫</span>
          <span class="nav-label">Práctica por Temas</span>
        </button>
        <button class="nav-item" data-view="fallos">
          <span class="nav-icon">⚑</span>
          <span class="nav-label">Repasar Fallos</span>
          <span id="nav-failed-badge" class="nav-badge">0</span>
        </button>
        <button class="nav-item" data-view="guia">
          <span class="nav-icon">⌘</span>
          <span class="nav-label">Chuleta y Guía Rápida</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-footer-title">Datos y progreso local</div>
        <div class="sidebar-actions">
          <button id="btn-export-json" class="btn btn-sm btn-secondary" title="Exportar progreso en JSON">
            ↓ Exportar JSON
          </button>
          <button id="btn-import-json" class="btn btn-sm btn-secondary" title="Importar progreso desde JSON">
            ↑ Importar JSON
          </button>
          <input type="file" id="input-import-json" accept=".json,application/json" hidden>
          <button id="btn-reset-stats" class="btn btn-sm btn-danger-ghost" title="Borrar todo el progreso guardado">
            ✕ Resetear progreso
          </button>
        </div>
      </div>
    </aside>

    <main id="main-content" class="main-content">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-simulacro" class="view"></section>
      <section id="view-bloques" class="view"></section>
      <section id="view-fallos" class="view"></section>
      <section id="view-guia" class="view"></section>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Detalle</h3>
        <button id="modal-close" class="icon-btn" aria-label="Cerrar">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
